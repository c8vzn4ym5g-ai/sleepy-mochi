name: SleepyMochi
options:
  bundleIdPrefix: com.sleepymochi
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ASSETCATALOG_COMPILER_APPICON_NAME: ''
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: 晚安糰子
targets:
  MochiPreview:
    type: application
    platform: iOS
    sources:
      - path: App/MochiApp.swift
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.sleepymochi.preview
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) PREVIEW_ONLY'
  Mochi:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.sleepymochi.prototype
        CODE_SIGN_ENTITLEMENTS: Mochi.entitlements
    dependencies:
      - target: MochiShield
      - target: MochiMonitor
      - target: MochiAction
  MochiShield:
    type: app-extension
    platform: iOS
    sources:
      - Shield
      - Shared
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.sleepymochi.prototype.shield
        CODE_SIGN_ENTITLEMENTS: Mochi.entitlements
    info:
      path: Shield/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
  MochiMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.sleepymochi.prototype.monitor
        CODE_SIGN_ENTITLEMENTS: Mochi.entitlements
    info:
      path: Monitor/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
  MochiAction:
    type: app-extension
    platform: iOS
    sources: [Action, Shared]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.sleepymochi.prototype.action
        CODE_SIGN_ENTITLEMENTS: Mochi.entitlements
    info:
      path: Action/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
schemes:
  MochiPreview:
    build:
      targets:
        MochiPreview: all
  Mochi:
    build:
      targets:
        Mochi: all
  MochiProbe:
    build:
      targets:
        Mochi: all
    run:
      commandLineArguments:
        --probe: true
